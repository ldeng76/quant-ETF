[project]
name = "quant-etf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "numpy>=2.4.0",
    "pandas>=2.3.3",
    "pandas-stubs~=2.3.3",
    "pytdx",
    "scipy>=1.16.3",
    "requests>=2.31.0",
]

[tool.uv.sources]
pytdx = { path = "docs/pytdx-1.72-py3-none-any.whl" }

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
name = "tsinghua"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
