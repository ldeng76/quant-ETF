[project]
name = "quant-etf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "numpy>=2.4.0",
    "pandas>=2.3.3",
    "pandas-stubs~=2.3.3",
    "pytdx",
    "scipy>=1.16.3",
    "requests>=2.31.0",
    "psutil>=7.2.2",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "akshare>=1.18.63",
    "PyJWT>=2.8.0",
    "itsdangerous>=2.1.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
quant-etf = "quant_etf.cli:main"
quant-dashboard = "quant_etf.dashboard.app:main"

[tool.uv.sources]
pytdx = { path = "docs/pytdx-1.72-py3-none-any.whl" }

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
name = "tsinghua"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: marks tests as integration tests that require real server connections",
]
