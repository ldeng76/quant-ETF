<div class="py-3" x-data="{
    showScheduleModal: false,
    DEFAULT_BAR_INTERVAL: '1d',
    scheduleForm: { strategy: '', bar_interval: '1d' },
    strategies: [],
    async initStrategies() {
        try {
            const resp = await fetch('/api/strategy/strategies');
            this.strategies = await resp.json();
            if (this.strategies.length > 0 && !this.scheduleForm.strategy) {
                this.scheduleForm.strategy = this.strategies[0].name;
            }
        } catch (e) {
            console.error('Failed to load strategies:', e);
        }
    },
    resetScheduleForm() { 
        this.scheduleForm = { strategy: this.strategies[0]?.name || '', bar_interval: this.DEFAULT_BAR_INTERVAL };
    },
}" x-init="initStrategies()" x-on:open-schedule-modal.window="showScheduleModal = true; resetScheduleForm()">
    <h4><i class="bi bi-eye"></i> 实时监控</h4>
    <hr>

    <div class="row mb-3">
        <div class="col-md-4">
            <div class="card text-bg-success">
                <div class="card-body">
                    <h6>运行状态</h6>
                    <span id="monitor-status">🟢 活跃</span>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-bg-info">
                <div class="card-body">
                    <h6>定时策略</h6>
                    <span id="schedule-count">加载中...</span>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-bg-secondary">
                <div class="card-body">
                    <h6>最近执行</h6>
                    <span id="last-run">-</span>
                </div>
            </div>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>定时策略配置</span>
            <button class="btn btn-sm btn-outline-primary"
                    @click="$dispatch('open-schedule-modal')">
                <i class="bi bi-plus"></i> 新增
            </button>
        </div>
        <div class="card-body" id="schedule-table"
             hx-get="/api/market/schedules"
             hx-trigger="load delay:100ms, every 10s">
            <div class="spinner-border spinner-border-sm"></div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <span>最新信号流 (SSE)</span>
        </div>
        <div class="card-body" style="max-height: 300px; overflow-y: auto;" id="signal-stream">
            <div class="text-muted small">等待实时信号...</div>
        </div>
    </div>

    <!-- 新增调度模态框 -->
    <div x-show="showScheduleModal" x-cloak
         style="position:fixed;inset:0;z-index:1050;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;"
         x-on:click.self="showScheduleModal = false">
        <div class="bg-white rounded shadow p-4" style="min-width:400px;max-width:90vw;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">新增定时策略</h5>
                <button class="btn-close" x-on:click="showScheduleModal = false"></button>
            </div>
            <form x-on:submit.prevent="
                fetch('/api/market/schedules', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({strategy: scheduleForm.strategy, bar_interval: scheduleForm.bar_interval})
                }).then(() => {
                    htmx.ajax('GET', '/api/market/schedules', {target: '#schedule-table'});
                    showScheduleModal = false;
                });
            ">
                <div class="mb-2">
                    <label class="form-label small">策略名称 *</label>
                    <select name="strategy" class="form-select form-select-sm" x-model="scheduleForm.strategy" required>
                        <option value="" disabled>请选择策略</option>
                        <template x-for="s in strategies" :key="s.name">
                            <option :value="s.name" x-text="s.title + '（' + s.name + '）'"></option>
                        </template>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label small">K线周期 *</label>
                    <select name="bar_interval" class="form-select form-select-sm" x-model="scheduleForm.bar_interval" required>
                        <option value="1d">日线</option>
                        <option value="60m">60分钟</option>
                        <option value="30m">30分钟</option>
                        <option value="15m">15分钟</option>
                    </select>
                </div>
                <div class="text-end">
                    <button type="button" class="btn btn-sm btn-secondary" x-on:click="showScheduleModal = false">取消</button>
                    <button type="submit" class="btn btn-sm btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // 更新定时策略数量
    function updateScheduleCount() {
        fetch('/api/market/schedules')
            .then(r => r.text())
            .then(html => {
                // 解析返回的 HTML,统计表格行数
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const rows = doc.querySelectorAll('tbody tr');
                const count = rows.length;
                const countEl = document.getElementById('schedule-count');
                if (countEl) {
                    countEl.textContent = count > 0 ? `${count} 个定时策略` : '暂无定时策略';
                }
            })
            .catch(err => {
                console.error('Failed to load schedule count:', err);
                const countEl = document.getElementById('schedule-count');
                if (countEl) {
                    countEl.textContent = '加载失败';
                }
            });
    }

    // 页面加载时立即更新,之后每10秒更新一次
    document.addEventListener('DOMContentLoaded', function() {
        updateScheduleCount();
        setInterval(updateScheduleCount, 10000);
    });

    // 如果 DOMContentLoaded 已经触发,立即执行
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        updateScheduleCount();
    }

    // 监听 SSE 信号流
    (function() {
        const evtSource = new EventSource('/events');
        const stream = document.getElementById('signal-stream');
        
        // 连接成功时清除"等待"提示
        evtSource.addEventListener('message', function(event) {
            const data = JSON.parse(event.data);
            if (!stream) return;
            
            // 如果是第一条消息且是连接事件,清除等待提示
            if (data.type === 'connected' && stream.children.length === 1 && 
                stream.children[0].classList.contains('text-muted')) {
                stream.innerHTML = '';
            }
            
            const time = new Date().toLocaleTimeString('zh-CN');
            const msg = document.createElement('div');
            msg.className = 'small mb-1';
            
            if (data.type === 'connected') {
                msg.innerHTML = `<span class="text-success">[${time}]</span> ✓ SSE 连接成功`;
            } else if (data.type === 'strategy_result') {
                const title = data.strategy_title || data.strategy;
                msg.innerHTML = `<span class="text-success">[${time}]</span> ${title} 执行完成`;
            } else if (data.type === 'strategy_error') {
                const title = data.strategy_title || data.strategy;
                msg.innerHTML = `<span class="text-danger">[${time}]</span> ${title} 执行失败: ${data.error}`;
            } else if (data.type === 'alert') {
                msg.innerHTML = `<span class="text-warning">[${time}]</span> ⚠ ${data.title}`;
            } else {
                // 未知事件类型,不显示
                return;
            }
            
            stream.prepend(msg);
            while (stream.children.length > 50) {
                stream.removeChild(stream.lastChild);
            }
        });
        
        // 连接错误处理
        evtSource.onerror = function() {
            if (!stream) return;
            const time = new Date().toLocaleTimeString('zh-CN');
            // 检查是否已有错误提示
            const existingError = stream.querySelector('.text-danger');
            if (!existingError || !existingError.textContent.includes('SSE')) {
                const msg = document.createElement('div');
                msg.className = 'small mb-1 text-danger';
                msg.innerHTML = `[${time}] ✗ SSE 连接断开,重连中...`;
                stream.prepend(msg);
            }
        };
    })();
</script>
