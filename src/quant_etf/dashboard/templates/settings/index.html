{% extends "base.html" %}
{% block title %}设置 - 量化ETF看板{% endblock %}
{% block content %}
<div class="py-3">
    <h4><i class="bi bi-gear"></i> 设置</h4>
    <hr>
    <div class="card">
        <div class="card-body">
            <h5 class="card-title">看板设置</h5>
            <p class="text-muted small">设置页面 - 功能开发中</p>
            <div class="mb-3">
                <label class="form-label">SSE 心跳间隔（秒）</label>
                <input type="number" class="form-control" value="30" disabled>
            </div>
            <div class="mb-3">
                <label class="form-label">告警刷新间隔（秒）</label>
                <input type="number" class="form-control" value="15" disabled>
            </div>
            <p class="text-muted small mt-3">更多设置功能将在后续版本中提供</p>
        </div>
    </div>
</div>
{% endblock %}
