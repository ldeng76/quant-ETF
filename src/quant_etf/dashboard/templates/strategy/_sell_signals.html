{# 卖出信号区块：今日掉榜的ETF列表 #}
{% if signals %}
<div class="alert alert-danger mb-3">
    <h6 class="alert-heading mb-2">
        <i class="bi bi-exclamation-triangle-fill"></i> 今日卖出信号（{{ signals|length }} 只掉榜）
    </h6>
    <div class="table-responsive">
        <table class="table table-sm table-bordered mb-0" style="background: transparent;">
            <thead>
                <tr>
                    <th>代码</th>
                    <th>名称</th>
                    <th>最后在榜日期</th>
                    <th>连续在榜天数</th>
                </tr>
            </thead>
            <tbody>
                {% for s in signals %}
                <tr>
                    <td><code>{{ s.code }}</code></td>
                    <td>{{ s.name }}</td>
                    <td>{{ s.last_on_date or '-' }}</td>
                    <td>{{ s.on_days or '-' }}{% if s.on_days %} 天{% endif %}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% else %}
<div class="alert alert-success mb-3">
    <i class="bi bi-check-circle-fill"></i> 今日无卖出信号
</div>
{% endif %}
