{% extends "base.html" %}
{% block title %}策略执行 - 量化ETF看板{% endblock %}
{% block content %}
<div class="py-3" x-data="{ runIds: [], polling: false, barInterval: '1d' }">
    <h4><i class="bi bi-bar-chart"></i> 策略执行</h4>
    <hr>

    <div class="card mb-3">
        <div class="card-body">
            <h5 class="card-title">选择策略</h5>
            <div class="mb-2 d-flex align-items-center gap-2">
                <label class="form-label mb-0 small">K线周期:</label>
                <select class="form-select form-select-sm" style="width:auto" x-model="barInterval" id="bar-interval">
                    <option value="1d" selected>日线</option>
                    <option value="60m">60分钟</option>
                    <option value="30m">30分钟</option>
                    <option value="15m">15分钟</option>
                </select>
                <span class="text-warning small" x-show="barInterval !== '1d'" x-cloak>
                    ⚠ 分钟周期需要先回填数据，请确保已运行 `quant-etf minute-backfill`
                </span>
            </div>
            <div id="strategy-list">
                <div class="spinner-border spinner-border-sm"></div> 加载策略列表...
            </div>
            <button class="btn btn-primary mt-2" id="run-strategy-btn"
                    x-on:click="
                        const checked = document.querySelectorAll('input[name=strategies]:checked');
                        const strategies = Array.from(checked).map(c => c.value);
                        if (strategies.length === 0) { alert('请至少选择一个策略'); return; }
                        $el.disabled = true;
                        $el.innerHTML = '<span class=&quot;spinner-border spinner-border-sm&quot;></span> 执行中...';
                        fetch('/api/strategy/run', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({strategies: strategies, bar_interval: barInterval})
                        })
                        .then(r => r.json())
                        .then(data => {
                            if (data.run_ids && data.run_ids.length > 0) {
                                htmx.ajax('GET', '/api/strategy/results/' + data.run_ids[0], {target: '#strategy-result'});
                            }
                        })
                        .catch(err => {
                            document.getElementById('strategy-result').innerHTML = '<div class=&quot;alert alert-danger&quot;>执行失败: ' + err + '</div>';
                        })
                        .finally(() => {
                            $el.disabled = false;
                            $el.innerHTML = '<i class=&quot;bi bi-play-fill&quot;></i> 执行选中策略';
                        });
                    ">
                <i class="bi bi-play-fill"></i> 执行选中策略
            </button>
        </div>
    </div>
    <div id="strategy-result">
        <div class="text-muted small">选择策略后执行查看结果</div>
    </div>
</div>

<script>
    // 加载策略列表
    (function() {
        fetch('/api/strategy/strategies')
            .then(r => r.json())
            .then(strategies => {
                const html = strategies.map(s => `
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" name="strategies" value="${s.name}" id="s-${s.name}">
                        <label class="form-check-label" for="s-${s.name}">
                            ${s.name} <small class="text-muted">${s.description}</small>
                        </label>
                    </div>
                `).join('');
                document.getElementById('strategy-list').innerHTML = html;
            });
    })();
    // SSE 监听：scheduler 执行完成后自动加载结果
    (function() {
        const evtSource = new EventSource('/events');
        evtSource.onmessage = function(event) {
            try {
                const data = JSON.parse(event.data);
                if (data.type === 'strategy_result' && data.run_id) {
                    htmx.ajax('GET', '/api/strategy/results/' + data.run_id, {target: '#strategy-result'});
                }
            } catch(e) {}
        };
    })();
</script>
{% endblock %}
